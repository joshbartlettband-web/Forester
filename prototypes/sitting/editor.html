<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halsey Card Editor</title>
<style>
  @font-face { font-family: "Halsey Hand"; src: url(fonts/HalseyHand.woff2) format("woff2"); font-display: swap; }
  :root {
    --sandhills-ochre: #C8A464;
    --prairie-sage: #6E7F5E;
    --ogallala-sky: #8BAAC2;
    --twilight-indigo: #243044;
    --porch-yellow: #E2B842;
    --limestone: #D9CFC1;
    --silo-rust: #9C4A33;
    --abundance-gold: #F4D35E;
    --ink: #1F1B2E;
    --paper: #F1EBDC;
    --river-blue: #3F78AD;
    --barn-red: #A8352C;
    --dusk-pink: #D4577F;
    --aurora-green: #7FE3B5;
    --font-ui: "Atkinson Hyperlegible", "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-hand: "Halsey Hand", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.45;
  }

  header {
    background: var(--twilight-indigo);
    color: var(--paper);
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 3px solid var(--sandhills-ochre);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  header h1 {
    margin: 0;
    font-family: var(--font-hand);
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header .sub {
    font-size: 0.82rem;
    color: var(--limestone);
    margin-left: 10px;
    font-family: var(--font-ui);
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  button, .file-btn {
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--sandhills-ochre);
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover, .file-btn:hover {
    background: var(--sandhills-ochre);
    color: var(--ink);
  }
  button.primary {
    background: var(--abundance-gold);
    color: var(--ink);
    border-color: var(--abundance-gold);
  }
  button.primary:hover {
    background: var(--porch-yellow);
  }
  button.danger {
    border-color: var(--barn-red);
    color: var(--barn-red);
    background: transparent;
  }
  button.danger:hover {
    background: var(--barn-red);
    color: var(--paper);
  }

  .filters {
    background: var(--limestone);
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid rgba(31, 27, 46, 0.15);
  }
  .filters input, .filters select {
    font-family: var(--font-ui);
    font-size: 0.86rem;
    padding: 6px 9px;
    border: 1px solid rgba(31, 27, 46, 0.28);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
  }
  .stats {
    margin-left: auto;
    font-size: 0.82rem;
    color: var(--twilight-indigo);
    font-weight: 600;
  }

  main {
    display: grid;
    grid-template-columns: 1fr 410px;
    min-height: calc(100vh - 115px);
  }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; }
  }

  .grid-pane {
    padding: 18px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 16px;
    align-content: start;
  }

  /* Game Card Layout — never puts rules text directly on a photo */
  .story-card {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(31, 27, 46, 0.08);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .story-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(31, 27, 46, 0.15);
  }
  .story-card.selected {
    border-color: var(--silo-rust);
    box-shadow: 0 0 0 3px var(--abundance-gold);
  }
  .story-card.holdout {
    border-style: dashed;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 9px;
    background: var(--twilight-indigo);
    color: var(--paper);
    font-size: 0.75rem;
    font-weight: 700;
  }
  .card-top.rarity-uncommon { background: var(--prairie-sage); }
  .card-top.rarity-rare { background: var(--silo-rust); }

  .pill-row {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .stat-badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    background: var(--paper);
    color: var(--ink);
  }
  .stat-badge.weight { background: var(--abundance-gold); }
  .stat-badge.vivid { background: var(--ogallala-sky); }

  .card-art-frame {
    height: 92px;
    background: linear-gradient(135deg, var(--limestone), #e7dfce);
    border-bottom: 1px solid rgba(31, 27, 46, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
    position: relative;
  }
  .card-art-frame.has-img { padding: 0; overflow: hidden; }
  .card-art-frame img.ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card-art-frame img.ph.contain { object-fit: contain; padding: 6px; }
  .card-art-frame img.ov { position: absolute; right: 4px; bottom: 2px; height: 86%; mix-blend-mode: multiply; }
  .card-art-frame .art-kind { position: relative; z-index: 1; background: rgba(241,235,220,.85); padding: 1px 6px; border-radius: 4px; align-self: flex-start; margin: 5px; }
  .warn { color: var(--barn-red); font-weight: 700; }
  .budget-box .warn { color: var(--dusk-pink); }
  .art-kind {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--twilight-indigo);
    opacity: 0.75;
    font-weight: 700;
  }
  .art-src {
    font-size: 0.74rem;
    color: var(--ink);
    word-break: break-all;
    margin-top: 2px;
  }
  .art-over {
    font-size: 0.68rem;
    color: var(--silo-rust);
    margin-top: 2px;
  }

  .card-body {
    padding: 10px 11px 11px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card-title {
    font-family: var(--font-hand);
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
  }
  .card-quote {
    font-family: var(--font-hand);
    font-size: 0.86rem;
    font-style: italic;
    color: var(--twilight-indigo);
    opacity: 0.9;
  }
  .card-meta {
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid rgba(31, 27, 46, 0.12);
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    font-size: 0.71rem;
  }
  .tag {
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--limestone);
    color: var(--ink);
    font-weight: 600;
  }
  .tag.event {
    background: var(--porch-yellow);
    color: var(--ink);
  }
  .tag.theme {
    background: var(--ogallala-sky);
    color: var(--ink);
  }

  /* Inspector Panel */
  .editor-pane {
    background: #EAE2D0;
    border-left: 2px solid rgba(31, 27, 46, 0.2);
    padding: 16px 18px;
    position: sticky;
    top: 62px;
    height: calc(100vh - 62px);
    overflow-y: auto;
  }
  @media (max-width: 980px) {
    .editor-pane { position: static; height: auto; border-left: none; border-top: 2px solid var(--ink); }
  }
  .editor-pane h2 {
    margin: 0 0 10px;
    font-family: var(--font-hand);
    font-size: 1.25rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .field.full { grid-column: 1 / -1; }
  .field label {
    font-size: 0.74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--twilight-indigo);
  }
  .field input, .field select, .field textarea {
    font-family: var(--font-ui);
    font-size: 0.88rem;
    padding: 6px 8px;
    border: 1px solid rgba(31, 27, 46, 0.3);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .field input, .field select, .field textarea { width: 100%; min-width: 0; }
  .editor-pane { overflow-x: hidden; }
  .field input[readonly] {
    background: var(--limestone);
    font-weight: 700;
    cursor: not-allowed;
  }

  .budget-box {
    grid-column: 1 / -1;
    background: var(--twilight-indigo);
    color: var(--paper);
    border-radius: 7px;
    padding: 10px 12px;
    font-size: 0.82rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .budget-box .w-big {
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--abundance-gold);
  }

  .checks {
    grid-column: 1 / -1;
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 0.84rem;
    font-weight: 600;
  }

  .editor-actions {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .editor-actions button {
    color: var(--ink);
    border-color: var(--ink);
  }
  .editor-actions button:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: var(--twilight-indigo);
    color: var(--abundance-gold);
    padding: 10px 16px;
    border-radius: 7px;
    font-weight: 700;
    font-size: 0.86rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Halsey, Nebraska — Card Editor</h1>
    <span class="sub">Made by Gemini Neon · Weight comes from the value budget · Send the JSON back to fold it into the game</span>
  </div>
  <div class="toolbar">
    <label class="file-btn">Load cards.json<input id="fileInput" type="file" accept=".json" hidden></label>
    <button id="addBtn">+ New Card</button>
    <button id="copyBtn" class="primary">Copy JSON</button>
    <button id="downloadBtn">Download cards.json</button>
  </div>
</header>

<div class="filters">
  <input id="searchInput" type="search" placeholder="Search title, quote, id, people…">
  <select id="filterTheme"><option value="">All Themes</option></select>
  <select id="filterPlace"><option value="">All Places</option></select>
  <select id="filterEvent"><option value="">All Events</option></select>
  <select id="filterRarity">
    <option value="">All Rarities</option>
    <option value="basic">basic</option>
    <option value="uncommon">uncommon</option>
    <option value="rare">rare</option>
  </select>
  <div class="stats" id="statsText"></div>
</div>

<main>
  <section class="grid-pane" id="cardGrid"></section>
  <aside class="editor-pane" id="editorPane">
    <h2 id="editorHeading">Select a card</h2>
    <div id="editorForm" class="form-grid"></div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  let data = JSON.parse(document.getElementById('seed-data').textContent);
  let selectedId = data.cards[0] ? data.cards[0].id : null;

  const els = {
    grid: document.getElementById('cardGrid'),
    form: document.getElementById('editorForm'),
    heading: document.getElementById('editorHeading'),
    search: document.getElementById('searchInput'),
    theme: document.getElementById('filterTheme'),
    place: document.getElementById('filterPlace'),
    event: document.getElementById('filterEvent'),
    rarity: document.getElementById('filterRarity'),
    stats: document.getElementById('statsText'),
    toast: document.getElementById('toast'),
  };

  function computeWeight(card) {
    const tier = data.budget[card.rarity] || data.budget.basic;
    const costIdx = Math.max(0, Math.min(tier.length - 1, Number(card.cost) || 0));
    const baseBudget = tier[costIdx];
    const mult = card.event && data.eventMultiplier[card.event] != null
      ? data.eventMultiplier[card.event]
      : 1;
    const vivid = Math.max(1, Number(card.v) || 1);
    const raw = (baseBudget * mult) / vivid;
    const caps = data.vividCap || { basic: 1, uncommon: 2, rare: 3, exceptions: { 'fog-cranes': 2 } };
    const cap = (caps.exceptions && caps.exceptions[card.id]) || caps[card.rarity] || 3;
    return {
      w: Math.max(data.minWeight ?? 2, Math.round(raw)),
      cap,
      over: vivid > cap,
      baseBudget,
      mult,
      vivid,
      raw,
    };
  }

  function syncAllWeights() {
    for (const c of data.cards) {
      c.w = computeWeight(c).w;
    }
  }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove('show'), 2100);
  }

  function uniqueSorted(arr) {
    return Array.from(new Set(arr.filter(Boolean))).sort();
  }

  function populateFilterDropdowns() {
    const themes = uniqueSorted(data.cards.map(c => c.theme));
    const places = uniqueSorted(data.cards.map(c => c.place));
    const events = uniqueSorted(data.cards.map(c => c.event));

    function refill(sel, label, items) {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${label}</option>` +
        items.map(v => `<option value="${v}">${v}</option>`).join('');
      if (items.includes(cur)) sel.value = cur;
    }
    refill(els.theme, 'All Themes', themes);
    refill(els.place, 'All Places', places);
    refill(els.event, 'All Events', events);
  }

  function getFilteredCards() {
    const q = els.search.value.trim().toLowerCase();
    return data.cards.filter(c => {
      if (els.theme.value && c.theme !== els.theme.value) return false;
      if (els.place.value && c.place !== els.place.value) return false;
      if (els.event.value && c.event !== els.event.value) return false;
      if (els.rarity.value && c.rarity !== els.rarity.value) return false;
      if (q) {
        const hay = [c.id, c.title, c.quote, c.theme, c.place, c.era, (c.people || []).join(' ')]
          .join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderGrid() {
    const list = getFilteredCards();
    els.stats.textContent = `Showing ${list.length} / ${data.cards.length} cards`;
    els.grid.innerHTML = list.map(c => {
      const calc = computeWeight(c);
      c.w = calc.w;
      const sel = c.id === selectedId ? ' selected' : '';
      const hold = c.holdout ? ' holdout' : '';
      const art = c.art || {};
      return `
        <article class="story-card${sel}${hold}" data-id="${esc(c.id)}">
          <div class="card-top rarity-${esc(c.rarity)}">
            <span>Trust ${c.cost} · ${esc(c.rarity)}</span>
            <span class="pill-row">
              <span class="stat-badge weight" title="Weight (derived)">W ${c.w}</span>
              <span class="stat-badge vivid" title="Vivid">V ${c.v}</span>
            </span>
          </div>
          <div class="card-art-frame${art.src ? ' has-img' : ''}">
            ${art.src ? `<img class="ph${art.kind === 'object' || art.kind === 'drawing' ? ' contain' : ''}" src="${esc(art.src)}" alt="" loading="lazy">` : ''}
            ${art.over ? `<img class="ov" src="${esc(art.over)}" alt="" loading="lazy">` : ''}
            <div class="art-kind">${esc(art.kind || 'art')}${calc.over ? ' · <span class="warn">vivid over cap</span>' : ''}</div>
            ${art.src ? '' : '<div class="art-src">(no art yet)</div>'}
          </div>
          <div class="card-body">
            <div class="card-title">${esc(c.title)}</div>
            <div class="card-quote">${esc(c.quote)}</div>
            <div class="card-meta">
              <span class="tag theme">${esc(c.theme)}</span>
              <span class="tag">${esc(c.place)}</span>
              <span class="tag">${esc(c.era)}</span>
              ${c.event ? `<span class="tag event">${esc(c.event)}</span>` : ''}
              ${c.small ? `<span class="tag">small</span>` : ''}
              ${c.holdout ? `<span class="tag">holdout</span>` : ''}
            </div>
          </div>
        </article>
      `;
    }).join('');
  }

  function renderEditor() {
    const card = data.cards.find(c => c.id === selectedId);
    if (!card) {
      els.heading.textContent = 'Select a card';
      els.form.innerHTML = '';
      return;
    }
    const calc = computeWeight(card);
    card.w = calc.w;
    els.heading.textContent = card.title || card.id;

    const art = card.art || { kind: 'drawing', src: '' };
    const themes = uniqueSorted(data.cards.map(c => c.theme));
    const places = uniqueSorted(data.cards.map(c => c.place));
    const eras = uniqueSorted(data.cards.map(c => c.era));
    const events = ['', ...Object.keys(data.eventMultiplier)];

    els.form.innerHTML = `
      <div class="budget-box">
        <div>
          <div style="font-weight:700;">Derived Weight (Locked)</div>
          <div style="opacity:0.85;font-size:0.75rem;">
            Budget ${calc.baseBudget} × ${calc.mult} ÷ Vivid ${calc.vivid} = ${calc.raw.toFixed(2)}${calc.raw < 1.5 ? ' (at least 2)' : ''}
          </div>
          ${calc.over ? `<div class="warn" style="font-size:0.78rem;">Vivid ${calc.vivid} is over the ${esc(card.rarity)} cap of ${calc.cap}. The game will lower it to ${calc.cap}.</div>` : ''}
        </div>
        <div class="w-big">W ${calc.w}</div>
      </div>

      <div class="field">
        <label>ID</label>
        <input data-key="id" value="${esc(card.id)}">
      </div>
      <div class="field">
        <label>Rarity</label>
        <select data-key="rarity">
          ${['basic', 'uncommon', 'rare'].map(r => `<option value="${r}" ${card.rarity === r ? 'selected' : ''}>${r}</option>`).join('')}
        </select>
      </div>

      <div class="field full">
        <label>Title</label>
        <input data-key="title" value="${esc(card.title)}">
      </div>
      <div class="field full">
        <label>Quote</label>
        <textarea data-key="quote">${esc(card.quote)}</textarea>
      </div>

      <div class="field">
        <label>Theme</label>
        <input data-key="theme" list="theme-list" value="${esc(card.theme)}">
        <datalist id="theme-list">${themes.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      </div>
      <div class="field">
        <label>Place</label>
        <input data-key="place" list="place-list" value="${esc(card.place)}">
        <datalist id="place-list">${places.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
      </div>

      <div class="field">
        <label>Era</label>
        <input data-key="era" list="era-list" value="${esc(card.era)}">
        <datalist id="era-list">${eras.map(e => `<option value="${esc(e)}">`).join('')}</datalist>
      </div>
      <div class="field">
        <label>Event</label>
        <select data-key="event">
          ${events.map(ev => `<option value="${ev}" ${(card.event || '') === ev ? 'selected' : ''}>${ev || '(none)'}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label>Cost (Trust 0–2)</label>
        <select data-key="cost">
          ${[0, 1, 2].map(n => `<option value="${n}" ${Number(card.cost) === n ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Vivid (cap ${calc.cap} for ${esc(card.rarity)})</label>
        <input data-key="v" type="number" min="1" max="3" step="1" value="${card.v}">
      </div>

      <div class="field full">
        <label>People (comma-separated teller ids)</label>
        <input data-key="people" value="${esc((card.people || []).join(', '))}">
      </div>

      <div class="field">
        <label>Art Kind</label>
        <select data-art="kind">
          ${['drawing', 'render', 'painting', 'archive', 'object'].map(k => `<option value="${k}" ${art.kind === k ? 'selected' : ''}>${k}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Art Overlay (optional)</label>
        <input data-art="over" value="${esc(art.over || '')}" placeholder="sketches/...">
      </div>
      <div class="field full">
        <label>Art Source</label>
        <input data-art="src" value="${esc(art.src || '')}">
      </div>
      <div class="field full">
        <label>Art Credit (archive cards)</label>
        <input data-art="credit" value="${esc(art.credit || '')}" placeholder="Solomon D. Butcher · Library of Congress">
      </div>

      <div class="checks">
        <label><input type="checkbox" data-flag="small" ${card.small ? 'checked' : ''}> Small talk</label>
        <label><input type="checkbox" data-flag="holdout" ${card.holdout ? 'checked' : ''}> Holdout</label>
      </div>

      <div class="editor-actions full">
        <button type="button" id="dupCardBtn">Duplicate</button>
        <button type="button" id="delCardBtn" class="danger">Delete</button>
      </div>
    `;

    els.form.querySelectorAll('[data-key]').forEach(input => {
      const evt = input.tagName === 'SELECT' ? 'change' : 'input';
      input.addEventListener(evt, () => {
        const k = input.dataset.key;
        if (k === 'cost' || k === 'v') {
          card[k] = Math.max(k === 'v' ? 1 : 0, parseInt(input.value, 10) || 0);
        } else if (k === 'event') {
          card.event = input.value || null;
        } else if (k === 'people') {
          card.people = input.value.split(',').map(s => s.trim()).filter(Boolean);
        } else {
          card[k] = input.value;
          if (k === 'id') selectedId = card.id;
        }
        card.w = computeWeight(card).w;
        renderGrid();
        if (k === 'rarity' || k === 'cost' || k === 'v' || k === 'event') {
          renderEditor();
        } else {
          els.heading.textContent = card.title || card.id;
        }
      });
    });

    els.form.querySelectorAll('[data-art]').forEach(input => {
      const evt = input.tagName === 'SELECT' ? 'change' : 'input';
      input.addEventListener(evt, () => {
        card.art = card.art || { kind: 'drawing', src: '' };
        const k = input.dataset.art;
        const val = input.value.trim();
        if (val) card.art[k] = val;
        else if (k === 'over' || k === 'credit') delete card.art[k];
        else card.art[k] = '';
        renderGrid();
      });
    });

    els.form.querySelectorAll('[data-flag]').forEach(cb => {
      cb.addEventListener('change', () => {
        const k = cb.dataset.flag;
        if (cb.checked) card[k] = true;
        else delete card[k];
        renderGrid();
      });
    });

    document.getElementById('dupCardBtn').addEventListener('click', () => {
      const copy = JSON.parse(JSON.stringify(card));
      copy.id = card.id + '-copy';
      copy.title = card.title + ' (copy)';
      data.cards.push(copy);
      selectedId = copy.id;
      populateFilterDropdowns();
      renderGrid();
      renderEditor();
      showToast('Card duplicated');
    });

    document.getElementById('delCardBtn').addEventListener('click', () => {
      if (data.cards.length <= 1) return;
      const idx = data.cards.findIndex(c => c.id === card.id);
      if (idx >= 0) {
        data.cards.splice(idx, 1);
        selectedId = data.cards[Math.max(0, idx - 1)].id;
        populateFilterDropdowns();
        renderGrid();
        renderEditor();
        showToast('Card deleted');
      }
    });
  }

  els.grid.addEventListener('click', e => {
    const cardEl = e.target.closest('.story-card');
    if (!cardEl) return;
    selectedId = cardEl.dataset.id;
    renderGrid();
    renderEditor();
  });

  [els.search, els.theme, els.place, els.event, els.rarity].forEach(ctrl => {
    ctrl.addEventListener('input', renderGrid);
    ctrl.addEventListener('change', renderGrid);
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    const newCard = {
      id: 'new-story-' + (data.cards.length + 1),
      title: 'Untitled story',
      quote: 'Write the line here.',
      theme: 'Weather',
      place: 'halsey',
      era: 'Later',
      event: null,
      cost: 1,
      w: 6,
      v: 1,
      rarity: 'basic',
      people: [],
      art: { kind: 'drawing', src: 'sketches/traveler.png' },
    };
    newCard.w = computeWeight(newCard).w;
    data.cards.unshift(newCard);
    selectedId = newCard.id;
    populateFilterDropdowns();
    renderGrid();
    renderEditor();
    showToast('Added new card');
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    syncAllWeights();
    const out = JSON.stringify(data, null, 1);
    try {
      await navigator.clipboard.writeText(out);
      showToast('Copied cards.json to clipboard');
    } catch (_e) {
      const ta = document.createElement('textarea');
      ta.value = out;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('Copied cards.json');
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    syncAllWeights();
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cards.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded cards.json');
  });

  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed.cards)) throw new Error('Missing cards array');
        data = parsed;
        syncAllWeights();
        selectedId = data.cards[0] ? data.cards[0].id : null;
        populateFilterDropdowns();
        renderGrid();
        renderEditor();
        showToast('Loaded ' + file.name);
      } catch (err) {
        showToast('Invalid JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  });

  syncAllWeights();
  populateFilterDropdowns();
  renderGrid();
  renderEditor();
})();
</script>
</body>
</html>
