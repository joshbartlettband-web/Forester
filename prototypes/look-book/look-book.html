<title>Halsey Look Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;600;800&family=Overpass:wght@400;700&family=Overpass+Mono:wght@400;600&family=Zilla+Slab:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=VT323&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@500;600&family=Karla:wght@400;600&family=Cormorant:ital,wght@1,500;1,600&family=Spectral:wght@400;500&display=swap">
<style>
/* Layout: one column on phones (look tabs, the generated scene, its encounter card); scene and card side by side on wide screens.
   Single dark chrome by choice, so each look's own palette carries the page. */
:root{
  --bg:#121411; --panel:#1a1d19; --line:#2d322b; --fg:#e9e7df; --muted:#9ea195; --accent:#e3a548;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
header h1{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:.9;letter-spacing:.03em;margin:0;text-transform:uppercase}
header h1 span{color:var(--muted);font-weight:700;font-size:.5em;letter-spacing:.12em;margin-left:.4em;vertical-align:.35em}
header p{margin:0;color:var(--muted);max-width:62ch;text-wrap:pretty}
.controls{display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.tabs::-webkit-scrollbar{display:none}
.tab,.seg button,.btn{font:600 14px/1 var(--f-ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer;white-space:nowrap;flex:none}
.tab[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab:focus-visible,.seg button:focus-visible,.btn:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .n{font-family:var(--f-mono);font-weight:400;font-size:11px;opacity:.6;margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.btn{background:var(--accent);color:#1b1408;border-color:var(--accent)}
.seed{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:880px){.stage{grid-template-columns:minmax(0,540px) minmax(0,1fr)}}
.canvas-box{position:relative;width:100%;max-width:100%;aspect-ratio:4/5;background:#000;border-radius:3px;overflow:hidden}
canvas#scene{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.about{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:12px}
.about h3{margin:0;font:800 22px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.about p{margin:0;max-width:60ch;text-wrap:pretty}
.about .risk{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ---------- Encounter card: each look restyles it through these variables ---------- */
.card{--c-bg:#222;--c-fg:#eee;--c-muted:#aaa;--c-accent:#e3a548;--c-line:rgba(255,255,255,.2);--c-btn:transparent;--c-btn-fg:var(--c-fg);
  --c-head:var(--f-ui);--c-body:var(--f-ui);--c-label:var(--f-mono);--c-radius:0px;--c-hsize:30px;--c-hweight:700;--c-hstyle:normal;--c-htrans:none;
  position:relative;overflow:hidden;background:var(--c-bg);color:var(--c-fg);font-family:var(--c-body);border-radius:var(--c-radius);
  padding:20px;display:flex;flex-direction:column;gap:14px;transition:background .3s,color .3s}
.card>*{position:relative;z-index:1}
.card .place{font-family:var(--c-label);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-muted)}
.card h2{margin:0;font-family:var(--c-head);font-size:var(--c-hsize);font-weight:var(--c-hweight);font-style:var(--c-hstyle);text-transform:var(--c-htrans);line-height:1.02;text-wrap:balance}
.card .body{margin:0;font-size:15.5px;line-height:1.55;max-width:62ch;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--c-btn);color:var(--c-btn-fg);border:1px solid var(--c-line);border-radius:var(--c-radius);padding:11px 13px;font-size:15px}
.choice b{font-weight:600}
.choice .tag{font-family:var(--c-label);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);white-space:nowrap;text-align:right}
.tally{display:flex;flex-direction:column;gap:6px}
.tally .top{display:flex;justify-content:space-between;gap:10px;font-family:var(--c-label);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted);font-variant-numeric:tabular-nums}
.tally .top strong{color:var(--c-fg);font-weight:600}
.bar{height:8px;background:var(--c-line);border-radius:var(--c-radius);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-accent)}
.mod{display:flex;gap:10px;align-items:center;border-top:1px solid var(--c-line);padding-top:12px}
.mod .chip{width:34px;height:34px;flex:none;background:var(--c-accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mod div{display:flex;flex-direction:column;min-width:0}
.mod b{font-family:var(--c-head);font-weight:var(--c-hweight);font-style:var(--c-hstyle);font-size:16px;line-height:1.1}
.mod span{font-size:13px;color:var(--c-muted)}

.card[data-look="print"]{--c-bg:#25273f;--c-fg:#f2e4c6;--c-muted:#c9a98d;--c-accent:#e57b4f;--c-line:rgba(242,228,198,.28);--c-head:var(--f-display);--c-hsize:40px;--c-hweight:800;--c-htrans:uppercase;box-shadow:6px 6px 0 #e57b4f;margin-right:6px;margin-bottom:6px}
.card[data-look="print"] .choice{background:rgba(242,228,198,.07);border-color:transparent}

.card[data-look="lino"]{--c-bg:#e7e2d3;--c-fg:#171613;--c-muted:#5d5950;--c-accent:#b8432c;--c-line:#171613;--c-head:"Zilla Slab",Rockwell,Georgia,serif;--c-body:"Source Serif 4",Georgia,serif;--c-hsize:34px;--c-hweight:700;border:3px solid #171613}
.card[data-look="lino"] .choice{border-width:2px}
.card[data-look="lino"] .mod .chip{clip-path:none;border-radius:50%;background:radial-gradient(circle,#b8432c 0 40%,transparent 41% 55%,#b8432c 56% 62%,transparent 63%)}

.card[data-look="survey"]{--c-bg:#1c3d6e;--c-fg:#eaf1f8;--c-muted:#a9c0dc;--c-accent:#eaf1f8;--c-line:rgba(234,241,248,.4);--c-head:"Overpass","Highway Gothic",Arial,sans-serif;--c-body:"Overpass",Arial,sans-serif;--c-hsize:30px;--c-hweight:700;--c-htrans:uppercase;
  background-image:linear-gradient(rgba(234,241,248,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(234,241,248,.07) 1px,transparent 1px);background-size:20px 20px;outline:1px solid rgba(234,241,248,.6);outline-offset:-6px}
.card[data-look="survey"] .choice{border-style:dashed}
.card[data-look="survey"] .mod .chip{clip-path:none;background:none;border:1.5px solid #eaf1f8;border-radius:50%;box-shadow:inset 0 0 0 6px #1c3d6e,inset 0 0 0 7.5px #eaf1f8}

.card[data-look="signal"]{--c-bg:#0a0d0b;--c-fg:#f0b44c;--c-muted:#a07a36;--c-accent:#f0b44c;--c-line:#4a3a1c;--c-head:"VT323",ui-monospace,monospace;--c-body:"IBM Plex Mono",ui-monospace,monospace;--c-label:"IBM Plex Mono",ui-monospace,monospace;--c-hsize:42px;--c-hweight:400;--c-htrans:uppercase;text-shadow:0 0 6px rgba(240,180,76,.45);border:1px solid #3a2e14}
.card[data-look="signal"]::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.card[data-look="signal"] .body{font-size:14px}
.card[data-look="signal"] .choice::before{content:">";margin-right:-4px}
.card[data-look="signal"] .bar i{background:repeating-linear-gradient(90deg,#f0b44c 0 6px,transparent 6px 8px)}

.card[data-look="pieced"]{--c-bg:#2b3245;--c-fg:#f0e7d6;--c-muted:#bdb3a0;--c-accent:#d9a056;--c-line:rgba(240,231,214,.25);--c-head:"Jost",Futura,"Century Gothic",sans-serif;--c-body:"Karla",Arial,sans-serif;--c-hsize:32px;--c-hweight:600;padding-top:30px}
.card[data-look="pieced"]::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;z-index:1;
  background:linear-gradient(135deg,#d9a056 33%,transparent 33%) 0 0/16px 12px,linear-gradient(225deg,#9a5a4b 33%,transparent 33%) 0 0/16px 12px,#4b4b68}
.card[data-look="pieced"] .choice{background:rgba(240,231,214,.06);border-style:dashed;border-color:rgba(240,231,214,.35)}

.card[data-look="fog"]{--c-bg:#1e2422;--c-fg:#e0e4dc;--c-muted:#9aa49d;--c-accent:#f0a95a;--c-line:rgba(224,228,220,.16);--c-head:"Cormorant",Garamond,Georgia,serif;--c-body:"Spectral",Georgia,serif;--c-hsize:40px;--c-hweight:600;--c-hstyle:italic;--c-radius:14px;
  background:radial-gradient(120% 80% at 85% 110%,rgba(240,169,90,.22),transparent 60%),linear-gradient(#262d2a,#1b201e)}
.card[data-look="fog"] .choice{background:rgba(224,228,220,.05);border-color:transparent}
.card[data-look="fog"] .mod .chip{clip-path:none;border-radius:50%;background:radial-gradient(circle,#ffd29a,#f0a95a 35%,rgba(240,169,90,0) 70%)}

@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Halsey<span>Look book</span></h1>
    <p>Six ways to draw the same world. Every scene is generated by code from a seed, with no image files, so the same seed gives the same place in every look.</p>
  </header>

  <div class="controls">
    <div class="label" id="look-label">Look</div>
    <div class="tabs" id="looks" role="group" aria-labelledby="look-label"></div>
    <div class="row">
      <div class="seg" id="biomes" role="group" aria-label="Place"></div>
      <div class="seg" id="times" role="group" aria-label="Time of day"></div>
    </div>
    <div class="row">
      <button class="btn" id="reroll" type="button">New scene</button>
      <span class="seed" id="seed"></span>
    </div>
  </div>

  <div class="stage">
    <div class="canvas-box"><canvas id="scene" tabindex="0" aria-label="Generated scene. Tap for a new one."></canvas></div>
    <div class="side">
      <div class="about"><h3 id="about-name"></h3><p id="about-good"></p><p class="risk" id="about-risk"></p></div>
      <article class="card" id="card" data-look="print">
        <div class="place" id="c-place"></div>
        <h2 id="c-title"></h2>
        <p class="body" id="c-body"></p>
        <div class="choices" id="c-choices"></div>
        <div class="tally"><div class="top"><span>Provisions <strong id="c-prov"></strong></span><span id="c-season"></span></div><div class="bar"><i id="c-fill"></i></div></div>
        <div class="mod"><i class="chip" aria-hidden="true"></i><div><b id="c-mod"></b><span id="c-modtext"></span></div></div>
      </article>
      <p class="hint">The encounter is sample text. Its choices aren't playable yet. Tap the scene or press N for a new seed.</p>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= core math ================= */
const W=400,H=500,TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const range=(R,a,b)=>a+R()*(b-a);
function noise1(R){const v=new Float32Array(512);for(let i=0;i<512;i++)v[i]=R();return x=>{const i=Math.floor(x),f=x-i,s=f*f*(3-2*f);return v[i&511]*(1-s)+v[(i+1)&511]*s}}
function fbm(n,x,o=4){let a=0,amp=.5,f=1,t=0;for(let i=0;i<o;i++){a+=amp*n(x*f+i*37.1);t+=amp;amp*=.5;f*=2.07}return a/t}
function hexc(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,t){const A=hexc(a),B=hexc(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*clamp(t,0,1)).toString(16).padStart(2,'0')).join('')}
function rgba(c,a){const[r,g,b]=hexc(c);return`rgba(${r},${g},${b},${a})`}
function gray(v){v=Math.round(clamp(v,0,1)*255);return`rgb(${v},${v},${v})`}
function skyAt(st,f){const s=clamp(f,0,1)*(st.length-1),i=Math.min(st.length-2,Math.floor(s));return mix(st[i],st[i+1],s-i)}

/* ================= geometry ================= */
function profile(n,{y,amp,freq,off=0,oct=4,step=4}){const p=[];for(let x=-8;x<=W+8+step;x+=step)p.push([x,y-(fbm(n,(x+off)*freq,oct)-.5)*2*amp]);return p}
function profAt(p,x){const st=p[1][0]-p[0][0];const i=clamp(Math.floor((x-p[0][0])/st),0,p.length-2);const t=clamp((x-p[i][0])/st,0,1);return lerp(p[i][1],p[i+1][1],t)}
function closeLand(p){return[...p,[W+8,H+8],[-8,H+8]]}
const Lp=(pts,w=1)=>({t:'line',pts,w}), Pp=pts=>({t:'poly',pts}), Cp=(x,y,r)=>({t:'circ',x,y,r}), Op=(x,y,r,w=1)=>({t:'ring',x,y,r,w});

function pine(R,x,b,h,w){const n=5+(R()*4|0),tk=h*.1,L=[],Rr=[];
  for(let i=0;i<n;i++){const t=i/n,y0=b-tk-(h-tk)*t,y1=b-tk-(h-tk)*(i+1)/n;
    const wl=w*.5*(1-t*.85)*(.75+R()*.5),wr=w*.5*(1-t*.85)*(.75+R()*.5);
    L.push([x-wl,y0+h*.015],[x-wl*.3,y1+(y0-y1)*.25]);Rr.push([x+wr,y0+h*.015],[x+wr*.3,y1+(y0-y1)*.25])}
  const tw=Math.max(.5,w*.05);return[[x-tw,b],[x-tw,b-tk],...L,[x+(R()-.5)*w*.06,b-h],...Rr.reverse(),[x+tw,b-tk],[x+tw,b]]}
function cedar(R,N,x,b,h,w){const pts=[],n=28,o=R()*100,lean=(R()-.5)*.15;
  for(let i=0;i<n;i++){const th=i/n*TAU,u=(1-Math.cos(th))/2,wid=w/2*Math.pow(u,.55)*(1-.35*Math.pow(u,6)),s=Math.sin(th)>=0?1:-1;
    const j=1+.22*(N(o+i*.9)-.5)*2,py=b-h*(1-u)*.94-h*.04;pts.push([x+s*wid*j+lean*(b-py),py])}
  return pts}
function cotton(R,x,b,h,w){const blobs=[],cy=b-h*.62,n=6+(R()*4|0);
  for(let i=0;i<n;i++){const a=R()*TAU,rr=Math.sqrt(R());blobs.push([x+Math.cos(a)*w*.32*rr,cy+Math.sin(a)*h*.22*rr,w*range(R,.16,.26)])}
  const tw=Math.max(.6,w*.05);return{blobs,pts:[[x-tw,b],[x-tw*.7,cy+h*.1],[x-w*.15,cy],[x,cy+h*.08],[x+w*.12,cy-h*.02],[x+tw*.7,cy+h*.1],[x+tw,b]]}}
function snag(x,b,h,R){const ps=[Lp([[x,b],[x+(R()-.5)*h*.05,b-h]],Math.max(.7,h*.03))];
  for(let i=0;i<4;i++){const y=b-h*(.4+R()*.5),d=R()<.5?-1:1;ps.push(Lp([[x,y],[x+d*h*(.08+R()*.1),y-h*(.04+R()*.08)]],Math.max(.4,h*.015)))}return ps}
function lookout(x,b,h){const ps=[],bw=h*.24,tw=h*.09,top=b-h*.8;
  for(const[a,c]of[[-bw,-tw],[bw,tw],[-bw*.55,-tw*.6],[bw*.55,tw*.6]])ps.push(Lp([[x+a,b],[x+c,top]],h*.018));
  for(let i=0;i<4;i++){const y0=lerp(b,top,i/4),y1=lerp(b,top,(i+1)/4),w0=lerp(bw,tw,i/4),w1=lerp(bw,tw,(i+1)/4);
    ps.push(Lp([[x-w0,y0],[x+w1,y1]],h*.008),Lp([[x+w0,y0],[x-w1,y1]],h*.008),Lp([[x-w1,y1],[x+w1,y1]],h*.01))}
  const cw=tw*1.9,ch=h*.13;ps.push(Pp([[x-cw,top],[x+cw,top],[x+cw,top-ch],[x-cw,top-ch]]),Pp([[x-cw*1.25,top-ch],[x+cw*1.25,top-ch],[x,top-ch-h*.07]]));
  return{parts:ps,light:[x+cw*.3,top-ch*.5],lightR:h*.03,top:top-ch-h*.07}}
function windmill(x,b,h,R){const ps=[],top=b-h*.78,bw=h*.16,tw=h*.025;
  ps.push(Lp([[x-bw,b],[x-tw,top]],h*.014),Lp([[x+bw,b],[x+tw,top]],h*.014),Lp([[x-bw*.3,b+h*.01],[x,top]],h*.01));
  for(let i=1;i<5;i++){const y=lerp(b,top,i/5),w=lerp(bw,tw,i/5),y2=lerp(b,top,(i-1)/5),w2=lerp(bw,tw,(i-1)/5);ps.push(Lp([[x-w,y],[x+w,y]],h*.008),Lp([[x-w2,y2],[x+w,y]],h*.006))}
  const cx=x-h*.02,cy=top-h*.08,r=h*.17,miss=new Set([R()*18|0,R()*18|0]);
  ps.push(Lp([[x,top+h*.02],[cx,cy]],h*.02));
  for(let i=0;i<18;i++){if(miss.has(i))continue;const a=i/18*TAU;ps.push(Lp([[cx+Math.cos(a)*r*.25,cy+Math.sin(a)*r*.25],[cx+Math.cos(a)*r,cy+Math.sin(a)*r]],h*.012))}
  ps.push(Op(cx,cy,r*.98,h*.008),Op(cx,cy,r*.55,h*.006),Cp(cx,cy,r*.12),Lp([[cx,cy],[cx+r*1.5,cy-r*.1]],h*.012),
    Pp([[cx+r*1.05,cy-r*.05],[cx+r*1.7,cy-r*.45],[cx+r*1.75,cy+r*.15],[cx+r*1.1,cy+r*.12]]),
    Pp([[x+bw*.6,b],[x+bw*2.1,b],[x+bw*2.1,b-h*.05],[x+bw*.6,b-h*.05]]));
  return{parts:ps,top:cy-r}}
function pivot(x0,x1,b0,b1,h){const ps=[],n=5,ch=[];
  for(let i=0;i<=n*6;i++){const t=i/(n*6);ch.push([lerp(x0,x1,t),lerp(b0,b1,t)-h+Math.sin((t*n%1)*Math.PI)*h*.18])}
  ps.push(Lp(ch,h*.035));
  for(let s=0;s<n;s++){const ta=s/n,tb=(s+1)/n,tm=(ta+tb)/2,X=t=>lerp(x0,x1,t),G=t=>lerp(b0,b1,t);
    ps.push(Lp([[X(ta),G(ta)-h],[X(tm),G(tm)-h*.55],[X(tb),G(tb)-h]],h*.015));
    for(let k=1;k<6;k++){const tt=lerp(ta,tb,k/6),yT=G(tt)-h+Math.sin(k/6*Math.PI)*h*.18,yL=G(tt)-h+(1-Math.abs(k/6-.5)*2)*h*.45;ps.push(Lp([[X(tt),yT],[X(tt),yL]],h*.008))}}
  for(let i=0;i<=n;i++){const t=i/n,x=lerp(x0,x1,t),g=lerp(b0,b1,t),w=h*.35;
    ps.push(Lp([[x-w,g],[x,g-h],[x+w,g]],h*.03),Lp([[x-w*.5,g-h*.5],[x+w*.5,g-h*.5]],h*.015),Cp(x-w,g-h*.1,h*.1),Cp(x+w,g-h*.1,h*.1))}
  return ps}
function elevator(x,b,h,R){const ps=[],n=3+(R()*3|0),sw=h*.17;

/* ================= shared drawing ================= */
function poly(ctx,p){ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath()}
function pline(ctx,p){ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1])}

    if(p.t==='poly'){poly(ctx,p.pts);if(fill){ctx.fillStyle=fill;ctx.fill()}if(extra){ctx.lineWidth=extra;ctx.strokeStyle=stroke;ctx.stroke()}}
    else if(p.t==='line'){pline(ctx,p.pts);ctx.lineWidth=p.w+extra;ctx.strokeStyle=stroke;ctx.stroke()}
    else if(p.t==='circ'){ctx.arc(p.x,p.y,p.r,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(extra){ctx.lineWidth=extra;ctx.strokeStyle=stroke;ctx.stroke()}}
    else{ctx.arc(p.x,p.y,p.r,0,TAU);ctx.lineWidth=p.w+extra;ctx.strokeStyle=stroke;ctx.stroke()}}}
function drawGrass(ctx,it,col,extra=0){ctx.strokeStyle=col;ctx.lineCap='round';for(const[x,y,h,l]of it.strokes){ctx.lineWidth=Math.max(.6,h*.05)+extra;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+l*h*.3,y-h*.6,x+l*h,y-h);ctx.stroke()}}
function drawBirds(ctx,S,t,col,lw=1){const it=S.items.find(i=>i.type==='birds');if(!it)return;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';
  for(const b of it.list){const x=((b[0]+t*b[3])%(W+40)+W+40)%(W+40)-20,y=b[1]+Math.sin(t*1.7+b[0])*1.5,s=b[2],f=Math.sin(t*5+b[0]*3)*.35;
    ctx.beginPath();ctx.moveTo(x-s,y-s*(.3+f));ctx.quadraticCurveTo(x-s*.4,y-s*.45,x,y);ctx.quadraticCurveTo(x+s*.4,y-s*.45,x+s,y-s*(.3+f));ctx.stroke()}}

const lights=S=>S.items.filter(i=>i.type==='light');
const eyes=S=>S.items.filter(i=>i.type==='watcher'&&i.kind==='eyes');

const grainCv=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),d=x.createImageData(160,160),R=rng(7);
  for(let i=0;i<d.data.length;i+=4){const v=R();d.data[i]=d.data[i+1]=d.data[i+2]=255;d.data[i+3]=v>.82?Math.floor((v-.82)/.18*255):0}x.putImageData(d,0,0);return c})();

function paint(ctx,S,c){
  c.sky(ctx,S);
  for(const it of S.items){if(!isStatic(it))continue;c.before&&c.before(ctx,it,S);

const reduce=matchMedia('(prefers-reduced-motion: reduce)');

function buildCache(){const st=LOOKS.find(l=>l.id===state.look).style;
  if(st.lowres){const c=lowCache.getContext('2d');c.setTransform(LRW/W,0,0,LRW/W,0,0);c.clearRect(0,0,W,H);st.static(c,scene)}
  else{const c=cache.getContext('2d');cache.width=cv.width;cache.height=cv.height;const k=cv.width/W;c.setTransform(k,0,0,k,0,0);st.static(c,scene)}
  dirty=false}
function frame(t){if(!scene)return;if(dirty)buildCache();const st=LOOKS.find(l=>l.id===state.look).style,k=cv.width/W;
  if(st.lowres){lctx.setTransform(1,0,0,1,0,0);lctx.drawImage(lowCache,0,0);lctx.setTransform(LRW/W,0,0,LRW/W,0,0);st.overlay(lctx,scene,t);dither(lctx,dctx);
    mctx.setTransform(1,0,0,1,0,0);mctx.imageSmoothingEnabled=false;mctx.drawImage(dc,0,0,cv.width,cv.height);mctx.setTransform(k,0,0,k,0,0);st.hud(mctx,scene,t)}
  else{mctx.setTransform(1,0,0,1,0,0);mctx.drawImage(cache,0,0);mctx.setTransform(k,0,0,k,0,0);st.overlay(mctx,scene,t)}}
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(200,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=Math.round(w*H/W);dirty=true;frame(4)}}
function regen(){scene=genScene(state.seed,state.biome,state.time);dirty=true;frame(4)}

function el(tag,attrs={},kids=[]){const e=document.createElement(tag);for(const k in attrs){if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k])}kids.forEach(c=>e.append(c));return e}
function renderUI(){
  const looks=document.getElementById('looks');looks.replaceChildren(...LOOKS.map((l,i)=>{const b=el('button',{type:'button',class:'tab',id:'look-'+l.id,'aria-pressed':String(l.id===state.look)});b.append(el('span',{class:'n',text:String(i+1)}),l.name);b.onclick=()=>{state.look=l.id;store.set('look',l.id);dirty=true;renderUI();frame(4)};return b}));
  const bi=document.getElementById('biomes');bi.replaceChildren(...Object.entries(BIOMES).map(([id,b])=>{const e=el('button',{type:'button',id:'biome-'+id,'aria-pressed':String(id===state.biome),text:b.label});e.onclick=()=>{state.biome=id;store.set('biome',id);renderUI();regen()};return e}));
  const ti=document.getElementById('times');ti.replaceChildren(...TIMES.map(([id,lab])=>{const e=el('button',{type:'button',id:'time-'+id,'aria-pressed':String(id===state.time),text:lab});e.onclick=()=>{state.time=id;store.set('time',id);renderUI();regen()};return e}));
  document.getElementById('seed').textContent='Seed '+state.seed;
  const L=LOOKS.find(l=>l.id===state.look);document.getElementById('about-name').textContent=L.name;document.getElementById('about-good').textContent=L.good;document.getElementById('about-risk').textContent=L.risk;
  const C=CARDS[state.biome],card=document.getElementById('card');card.dataset.look=state.look;
  document.getElementById('c-place').textContent=C.place;document.getElementById('c-title').textContent=C.title;document.getElementById('c-body').textContent=C.body;
  document.getElementById('c-choices').replaceChildren(...C.choices.map(([a,b])=>el('div',{class:'choice'},[el('b',{text:a}),el('span',{class:'tag',text:b})])));
  document.getElementById('c-prov').textContent=`${C.prov[0]} / ${C.prov[1]}`;document.getElementById('c-season').textContent=C.season;document.getElementById('c-fill').style.width=(C.prov[0]/C.prov[1]*100)+'%';
  document.getElementById('c-mod').textContent=C.mod[0];document.getElementById('c-modtext').textContent=C.mod[1]}
function reroll(){state.seed=1+Math.floor(Math.random()*99999);store.set('seed',state.seed);renderUI();regen()}
document.getElementById('reroll').onclick=reroll;cv.onclick=reroll;
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='n'||e.key==='N')reroll();const i=parseInt(e.key,10);if(i>=1&&i<=LOOKS.length){document.getElementById('look-'+LOOKS[i-1].id).click()}});
new ResizeObserver(resize).observe(cv);
let last=0;function loop(now){requestAnimationFrame(loop);if(reduce.matches||document.hidden)return;if(now-last<66)return;last=now;frame(now/1000)}
renderUI();resize();regen();requestAnimationFrame(loop);
const fontLoads=['800 36px "Big Shoulders Display"','600 10px "Public Sans"','italic 11px "Source Serif 4"','700 11px "Overpass"','600 8.5px "Overpass Mono"','20px VT323'].map(f=>document.fonts.load(f).catch(()=>{}));
Promise.all(fontLoads).then(()=>{dirty=true;frame(4)});
/* test hook: render a still of any combination into a canvas */
window.__still=(look,biome,time,seed,width=400)=>{const S=genScene(seed,biome,time),st=LOOKS.find(l=>l.id===look).style,c=document.createElement('canvas');c.width=width;c.height=width*H/W;const x=c.getContext('2d'),k=width/W;
  if(st.lowres){const a=document.createElement('canvas');a.width=LRW;a.height=LRH;const ax=a.getContext('2d',{willReadFrequently:true});ax.setTransform(LRW/W,0,0,LRW/W,0,0);st.static(ax,S);st.overlay(ax,S,4);const b=document.createElement('canvas');b.width=LRW;b.height=LRH;dither(ax,b.getContext('2d'));x.imageSmoothingEnabled=false;x.drawImage(b,0,0,c.width,c.height);x.setTransform(k,0,0,k,0,0);st.hud(x,S,4)}
  else{x.setTransform(k,0,0,k,0,0);st.static(x,S);st.overlay(x,S,4)}return c};
</script>
